services:
  postgres:
    image: postgres:16-alpine
    container_name: dailyptr-postgres
    environment:
      - POSTGRES_USER=dailyptr
      # Set a real random value on the host (e.g. `openssl rand -hex 20`) -
      # this falls back to an insecure default otherwise.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dailyptr_insecure_default}
      - POSTGRES_DB=dailyptr
    volumes:
      - dailyptr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailyptr -d dailyptr"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dailyptr-web:latest
    container_name: dailyptr-web
    ports:
      - "8000:8000"
    networks:
      - default
      - arr-net
    environment:
      - DATABASE_URL=postgresql+psycopg2://dailyptr:${POSTGRES_PASSWORD:-dailyptr_insecure_default}@postgres:5432/dailyptr
      # Signs per-user login session cookies (app/auth.py) - set a real
      # random value on the host (e.g. `openssl rand -hex 32`), otherwise
      # this falls back to an insecure default baked into the image.
      - SECRET_KEY=${SECRET_KEY:-}
      # "Sign in with Google" (app/auth.py) - the app has no password auth of
      # its own, so these are required for login to work at all. From a
      # Google Cloud Console OAuth Client (type: Web application); see
      # app/config.py for what redirect URIs need to be registered on it.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Only needed behind a reverse proxy that doesn't forward scheme/host
      # (uvicorn here isn't run with --proxy-headers, so it can't infer
      # https on its own) - see app/config.py.
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Optional: enables AI grading of concept-check/code-review answers.
      # Unset on the host -> the app falls back to the plain self-graded flow.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./frontend:/app/frontend:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  arr-net:
    external: true

volumes:
  dailyptr_pg_data:

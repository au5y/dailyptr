version: "3.8"

services:
  # Builds the isolated image used to compile/run each C++ submission.
  # It is never "run" as a long-lived service - the web container launches
  # short-lived containers from this image on demand.
  sandbox-image:
    build:
      context: ./sandbox-runner
    image: dailyptr-sandbox:latest
    # This service only exists so `docker compose build` produces the image.
    command: ["true"]

  web:
    build:
      context: ./backend
    image: dailyptr-web:latest
    container_name: dailyptr-web
    ports:
      - "8000:8000"
    networks:
      - default
      - arr-net
    environment:
      - SANDBOX_MODE=docker
      - SANDBOX_IMAGE=dailyptr-sandbox:latest
      - DATABASE_URL=sqlite:////data/app.db
      # Signs per-user login session cookies (app/auth.py) - set a real
      # random value on the host (e.g. `openssl rand -hex 32`), otherwise
      # this falls back to an insecure default baked into the image.
      - SECRET_KEY=${SECRET_KEY:-}
      # "Sign in with Google" (app/auth.py) - the app has no password auth of
      # its own, so these are required for login to work at all. From a
      # Google Cloud Console OAuth Client (type: Web application); see
      # app/config.py for what redirect URIs need to be registered on it.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Only needed behind a reverse proxy that doesn't forward scheme/host
      # (uvicorn here isn't run with --proxy-headers, so it can't infer
      # https on its own) - see app/config.py.
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Optional: enables AI grading of concept-check answers. Unset on the
      # host -> the app falls back to the plain self-graded flow.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Docker-outside-of-Docker path translation for the sandbox's bind mount
      # (see app/sandbox/docker_runner.py) - SANDBOX_TMP_DIR is where this
      # container itself sees the shared directory below; SANDBOX_HOST_TMP_DIR
      # is that same directory's path on the actual host, which is what the
      # sibling `docker run` (sent to the host daemon over the socket) needs.
      - SANDBOX_TMP_DIR=/sandbox-tmp
      - SANDBOX_HOST_TMP_DIR=${PWD}/data/sandbox-tmp
    volumes:
      - ./data:/data
      - ./data/sandbox-tmp:/sandbox-tmp
      - ./frontend:/app/frontend:ro
      # Docker-outside-of-Docker: lets the web container ask the HOST docker
      # daemon to spin up sandbox containers as siblings, not nested inside it.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-image
    restart: unless-stopped

networks:
  arr-net:
    external: true

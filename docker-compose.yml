version: "3.8"

services:
  # Builds the isolated image used to compile/run each C++ submission.
  # It is never "run" as a long-lived service - the web container launches
  # short-lived containers from this image on demand.
  sandbox-image:
    build:
      context: ./sandbox-runner
    image: cpp-refresher-sandbox:latest
    # This service only exists so `docker compose build` produces the image.
    command: ["true"]

  web:
    build:
      context: ./backend
    image: cpp-refresher-web:latest
    ports:
      - "8000:8000"
    environment:
      - SANDBOX_MODE=docker
      - SANDBOX_IMAGE=cpp-refresher-sandbox:latest
      - DATABASE_URL=sqlite:////data/app.db
      # Optional: enables AI grading of concept-check answers. Unset on the
      # host -> the app falls back to the plain self-graded flow.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Docker-outside-of-Docker path translation for the sandbox's bind mount
      # (see app/sandbox/docker_runner.py) - SANDBOX_TMP_DIR is where this
      # container itself sees the shared directory below; SANDBOX_HOST_TMP_DIR
      # is that same directory's path on the actual host, which is what the
      # sibling `docker run` (sent to the host daemon over the socket) needs.
      - SANDBOX_TMP_DIR=/sandbox-tmp
      - SANDBOX_HOST_TMP_DIR=${PWD}/data/sandbox-tmp
    volumes:
      - ./data:/data
      - ./data/sandbox-tmp:/sandbox-tmp
      - ./frontend:/app/frontend:ro
      # Docker-outside-of-Docker: lets the web container ask the HOST docker
      # daemon to spin up sandbox containers as siblings, not nested inside it.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-image
    restart: unless-stopped

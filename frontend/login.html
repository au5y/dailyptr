<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daily++ - sign in</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="icon" type="image/x-icon" href="/static/assets/favicon.ico">

  <style>
    html,
    body {
      height: 100%;
    }

    .login-shell {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--panel-solid, #1c1c26);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.3);
    }

    .login-mascot {
      margin: 0 auto 10px;
      display: block;
    }

    .login-card h1 {
      margin: 0 0 6px;
      font-size: 1.4rem;
    }

    .login-card p.sub {
      margin: 12px 0 14px;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    .login-error {
      color: var(--red, #ff6b6b);
      font-size: 0.85rem;
      margin: 0 0 14px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      background: #fff;
      color: #1f1f1f;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    }

    .google-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
    }

    .offline-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      background: var(--violet);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--violet-shadow);
      margin-top: 14px;
      margin-bottom: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .offline-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 7px 0 var(--violet-shadow);
      animation: playWiggle 0.4s ease;
    }

    @keyframes playWiggle {

      0%,
      100% {
        rotate: 0deg;
      }

      25% {
        rotate: -2deg;
      }

      75% {
        rotate: 2deg;
      }
    }

    .brand {
      font-size: 2.0rem;
      font-weight: 700;
      color: #c8ebd5;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      min-height: 1.25em;
    }

    /* blinking cursor, terminal block style */
    .brand::after {
      content: "";
      display: inline-block;
      width: 0.1em;
      height: 1em;
      background: #c8ebd5;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
      transform: translateY(0.05em);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* on hover, snap straight to daily++ and stop cycling */
    .brand.locked::after {
      animation: blink 1s step-end infinite;
    }

    .offline-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--violet-shadow);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0 14px;
      opacity: 0.5;
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: currentColor;
    }
  </style>
</head>

<body>
  <div class="login-shell">
    <div class="login-card">
      <svg class="login-mascot mascot-flame" width="76" height="56" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2C12 2 6.5 8.2 6.5 13.2C6.5 17 9 20 12 20C15 20 17.5 17 17.5 13.2C17.5 8.2 12 2 12 2Z"
          fill="var(--orange)" />
        <path
          d="M12 7.5C12 7.5 9.3 11.4 9.3 14.2C9.3 16.4 10.5 18 12 18C13.5 18 14.7 16.4 14.7 14.2C14.7 11.4 12 7.5 12 7.5Z"
          fill="var(--yellow)" />
        <circle cx="10" cy="13.5" r="1" fill="var(--bg)" />
        <circle cx="13.6" cy="13.5" r="1" fill="var(--bg)" />
      </svg>
      <div class="brand" id="brand"></div>
      <script>
        const words = ["dailyptr", "daily++", "std::daily", "daily.log", "daily.getBetter()", "daily*", "ptr++"];
        const hoverWord = "daily++";
        const el = document.getElementById("brand");

        const TYPE_SPEED = 170;
        const DELETE_SPEED = 130;
        const HOLD_TIME = 1100;

        let wordIndex = 0;
        let isHovering = false;
        let timeoutId = null;

        function typeText(text, i, cb) {
          if (isHovering) return;
          el.textContent = text.slice(0, i);
          if (i < text.length) {
            timeoutId = setTimeout(() => typeText(text, i + 1, cb), TYPE_SPEED);
          } else {
            timeoutId = setTimeout(cb, HOLD_TIME);
          }
        }

        function deleteText(text, i, cb) {
          if (isHovering) return;
          el.textContent = text.slice(0, i);
          if (i > 0) {
            timeoutId = setTimeout(() => deleteText(text, i - 1, cb), DELETE_SPEED);
          } else {
            cb();
          }
        }

        function cycle() {
          if (isHovering) return;
          const current = words[wordIndex];
          typeText(current, 0, () => {
            deleteText(current, current.length, () => {
              wordIndex = (wordIndex + 1) % words.length;
              cycle();
            });
          });
        }

        function goToHoverState() {
          clearTimeout(timeoutId);
          const current = el.textContent;
          // delete whatever is currently shown, then type the hover word
          deleteText(current, current.length, () => {
            if (!isHovering) return;
            typeText(hoverWord, 0, () => {
              // hold on hoverWord while hovering; do nothing further
            });
          });
        }

        el.addEventListener("mouseenter", () => {
          isHovering = true;
          el.classList.add("locked");
          goToHoverState();
        });

        el.addEventListener("mouseleave", () => {
          isHovering = false;
          el.classList.remove("locked");
          clearTimeout(timeoutId);
          // resume cycling from a fresh word
          wordIndex = 0;
          cycle();
        });

        cycle();
      </script>
      <br>
      <div id="login-error" class="login-error" style="display:none;">Sign-in failed - try again.</div>
      <form method="post" action="auth/guest">
        <button type="submit" class="offline-btn">Play Now!</button>
      </form>
      <div class="divider">or</div>
      <p class="sub">Sign in to track your daily technical progress!</p>

      <a class="google-btn" href="auth/google/login">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4"
            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z" />
          <path fill="#34A853"
            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z" />
          <path fill="#FBBC05"
            d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z" />
          <path fill="#EA4335"
            d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z" />
        </svg>
        Sign in with Google
      </a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("error")) document.getElementById("login-error").style.display = "block";
  </script>
</body>

</html>
